name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke tests on synthetic data
        run: pytest -q tests/

      - name: Verify no controlled-access files leaked
        run: |
          # data/clinical/clinical.tsv is a deliberately published, de-identified
          # table (see .gitignore for the explicit exception). Allow it; block
          # any *other* clinical.tsv / extra.tsv that may sneak in.
          leaked=$(git ls-files | grep -E '(^|/)(clinical|extra)\.tsv$' \
                                 | grep -v '^data/clinical/clinical\.tsv$' \
                                 || true)
          if [ -n "$leaked" ]; then
            echo "Controlled-access file detected in repo!" >&2
            echo "$leaked" >&2
            exit 1
          fi
          if git ls-files | grep -E '\.(bam|vcf(\.gz)?|fastq(\.gz)?|fq(\.gz)?)$'; then
            echo "Sequencing file detected in repo!" >&2
            exit 1
          fi
